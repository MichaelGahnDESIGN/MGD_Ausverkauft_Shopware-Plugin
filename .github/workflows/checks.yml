name: Plugin-Prüfungen

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  pruefen:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['8.2', '8.4']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
      - name: PHP-Syntax
        run: find src tests -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Staging und Rückfall
        run: |
          php tests/atomic-installer-test.php
          php tests/update-opt-in-test.php
      - name: Composer-Metadaten
        run: composer validate --no-check-publish
