name: Quality

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: PHP syntax
        run: find src -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Composer validation
        run: composer validate --no-check-publish
